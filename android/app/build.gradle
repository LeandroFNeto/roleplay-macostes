plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uenp.atleticas'
    compileSdk 34

    defaultConfig {
        applicationId "com.uenp.atleticas"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero dependências extras - WebView puro do sistema Android
}
